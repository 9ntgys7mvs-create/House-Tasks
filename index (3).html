<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Tasks</title>
<style>
:root{--bg:#f5f3ee;--ink:#1d2830;--mut:#62707a;--card:#fff;--line:#dad6cc;--a:#2d6b8a;--ok:#2f7d51;--bad:#b0443a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a1f;--ink:#e7ebee;--mut:#98a4ad;--card:#1e252c;--line:#334049;--a:#72b3d2;--ok:#6cc48c;--bad:#e27d72}}
:root[data-theme="dark"]{--bg:#151a1f;--ink:#e7ebee;--mut:#98a4ad;--card:#1e252c;--line:#334049;--a:#72b3d2;--ok:#6cc48c;--bad:#e27d72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:16px 14px 60px}
h1{font:600 28px Georgia,serif;margin:4px 0 12px}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px}
button.pri{background:var(--a);color:#fff;border-color:var(--a)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.col h2{font:600 20px Georgia,serif;margin:0}
.cnt{color:var(--mut);font-size:14px;margin-bottom:6px}
.t{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.t input{width:22px;height:22px;margin-top:2px;flex:none}
.t .b{flex:1}
.t.d .n{text-decoration:line-through;color:var(--mut)}
.due{font-size:13px;color:var(--mut)}.due.late{color:var(--bad);font-weight:600}
.ed{border:0;background:none;color:var(--a);padding:4px 6px;font-size:14px}
.empty{color:var(--mut);padding:10px 0;font-size:15px}.bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--a)}
label{display:block;margin:10px 0 3px;color:var(--mut);font-size:14px}
input[type=text],input[type=date],select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(420px,92vw)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.nm{display:flex;gap:6px;margin-bottom:6px}.nm button{padding:6px 10px}
#sync{color:var(--mut);font-size:14px;margin-bottom:8px}
</style></head><body><main>
<h1>House Tasks</h1>
<div class="top"><button class="pri" id="add">+ Add task</button><button id="names">Names</button></div>
<div id="sync"></div><div id="bal" class="cnt" style="font-size:15px"></div>
<div id="view" class="grid"></div><section id="dl" class="col" style="margin-top:14px"></section>
<dialog id="dlg"></dialog>
</main>
<script>
let S={people:[{id:"p1",name:"Mom"},{id:"p2",name:"Son 1"},{id:"p3",name:"Son 2"}],tasks:[]},ref=null;
const $=i=>document.getElementById(i),dlg=$("dlg");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})};
const DB_URL="https://house-tasks1-default-rtdb.firebaseio.com";
const OK=DB_URL.startsWith("https://");
function save(){render();if(!OK){$("sync").textContent="Not connected yet. The database address hasn\u2019t been added to this page.";return}
 fetch(DB_URL.replace(/\/$/,"")+"/house.json",{method:"PUT",body:JSON.stringify(S)}).then(r=>{if(!r.ok)throw 0;$("sync").textContent="v3 \u00b7 Saved to the shared list at "+new Date().toLocaleTimeString()}).catch(()=>{$("sync").textContent="Couldn\u2019t save. Check your connection and try again."})}
let MAX=1;
const mins=t=>+t.m||30;
const dur=m=>{m=+m||30;return m<60?m+" min":(m/60)+" h"};
const tot=m=>{const h=Math.floor(m/60),r=m%60;return (h?h+" h ":"")+(r?r+" min":"")||"0 min"};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mkDue=s=>{s=(s||"").trim().toLowerCase();if(!s)return"";let m,d,x;if(x=s.match(/^(\d{1,2})\s*[/.-]\s*(\d{1,2})/)){m=+x[1];d=+x[2]}else if(x=s.match(/^([a-z]{3,9})\.?\s+(\d{1,2})/)){m=MON.findIndex(n=>x[1].startsWith(n.toLowerCase()))+1;d=+x[2]}else if(x=s.match(/^(\d{1,2})\s+([a-z]{3,9})/)){m=MON.findIndex(n=>x[2].startsWith(n.toLowerCase()))+1;d=+x[1]}if(!(m>=1&&m<=12&&d>=1&&d<=31))return null;const n=new Date(),y=n.getFullYear();let c=new Date(y,m-1,Math.min(d,new Date(y,m,0).getDate()));if(c<new Date(y,n.getMonth(),n.getDate()-30))c=new Date(y+1,m-1,Math.min(d,new Date(y+1,m,0).getDate()));return iso(c)};
const cnt=id=>(S.delays||[]).filter(x=>x.tid===id).length;
const owners=t=>t.os||(t.o?[t.o]:[]);
const T=p=>S.tasks.filter(t=>owners(t).includes(p.id)).reduce((a,t)=>a+mins(t),0);
function task(t){const late=t.due&&!t.done&&t.due<iso(new Date());
 return `<div class="t ${t.done?"d":""}"><input type="checkbox" data-c="${t.id}" ${t.done?"checked":""} aria-label="Done"><div class="b"><div class="n">${esc(t.t)}</div><div class="due">About ${dur(t.m)}${owners(t).length>1?" each \u00b7 together: "+owners(t).map(id=>(S.people.find(p=>p.id===id)||{}).name).filter(Boolean).map(esc).join(" + "):""}</div>${cnt(t.id)?`<div class="due late">Delayed ${cnt(t.id)} time${cnt(t.id)>1?"s":""}</div>`:""}${t.n?`<div class="due" style="white-space:pre-wrap;color:var(--ink)">Note: ${esc(t.n)}</div>`:""}${t.due?`<div class="due ${late?"late":""}">${late?"Overdue \u00b7 ":"Due "}${fmt(t.due)}</div>`:""}</div>${t.done?"":`<button class="ed" data-dl="${t.id}">Delay</button>`}<button class="ed" data-e="${t.id}">Edit</button></div>`}
function col(name,list){const dn=list.filter(t=>t.done).length,o=list.filter(t=>!t.done).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")),d=list.filter(t=>t.done);
 return `<section class="col"><h2>${esc(name)}</h2><div class="cnt">${dn} of ${list.length} done \u00b7 ${tot(list.reduce((a,t)=>a+mins(t),0))} of work</div><div class="bar"><i style="width:${Math.round(list.reduce((a,t)=>a+mins(t),0)/MAX*100)}%"></i></div>${list.length?o.concat(d).map(task).join(""):'<div class="empty">No tasks yet.</div>'}</section>`}
function render(){const ids=S.people.map(p=>p.id),un=S.tasks.filter(t=>!owners(t).some(o=>ids.includes(o)));MAX=Math.max(1,...S.people.map(T),un.reduce((a,t)=>a+mins(t),0));renderDelays();$("bal").textContent="Work assigned: "+S.people.map(p=>p.name+" "+tot(T(p))).join(" \u00b7 ");
 $("view").innerHTML=S.people.map(p=>col(p.name,S.tasks.filter(t=>owners(t).includes(p.id)))).join("")+(un.length?col("Unassigned",un):"")}
function form(html,ok,extra){dlg.innerHTML=`<form method="dialog">${html}<div class="row">${extra||""}<button value="x" formnovalidate>Cancel</button><button class="pri" value="ok">Save</button></div></form>`;dlg.returnValue="";dlg.onclose=()=>{if(dlg.returnValue==="ok")ok(new FormData(dlg.querySelector("form")))};dlg.showModal()}
function taskDlg(t){const opts=S.people.map(p=>`<label style="color:var(--ink);display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" name="o" value="${p.id}" ${t&&owners(t).includes(p.id)?"checked":""}> ${esc(p.name)}</label>`).join("");
 form(`<h3>${t?"Edit task":"New task"}</h3><label>Task<input type="text" name="t" required value="${esc(t?.t)}"></label><label>Assign to (tick two or more to do it together)</label>${opts}<label>Note: where is it, and why does it take that long?<textarea name="n" rows="3" placeholder="e.g. Garage, back shelves. Lots to sort through.">${esc(t?.n)}</textarea></label><label>Time needed<select name="m">${[15,30,45,60,90,120,180,240].map(m=>`<option value="${m}" ${mins(t||{})===m?"selected":""}>${dur(m)}</option>`).join("")}</select></label><label>${t?.due?"Due date (to move it, use Delay)":"Due date (optional, type it like 12/5)"}<input type="text" name="dd" ${t?.due?"readonly":""} autocomplete="off" placeholder="12/5 or Dec 5" value="${t?.due?(+t.due.split("-")[1])+"/"+(+t.due.split("-")[2]):""}"></label>`,
 f=>{const dd=mkDue(f.get("dd"));if(dd===null)$("sync").textContent="Couldn\u2019t read that date. Try typing it like 12/5 or Dec 5.";const v={t:f.get("t").trim(),os:f.getAll("o"),due:t?.due||(dd===null?"":dd),m:+f.get("m"),n:(f.get("n")||"").trim()};if(!v.t)return;if(t){Object.assign(t,v);delete t.o}else S.tasks.push({id:uid(),done:false,...v});save()},
 t&&!cnt(t.id)?`<button type="button" data-del="${t.id}" style="margin-right:auto">Delete</button>`:"")}
function delayDlg(t){const os=owners(t),who=S.people.map(p=>`<option value="${p.id}" ${os[0]===p.id?"selected":""}>${esc(p.name)}</option>`).join(""),base=t.due||iso(new Date()),nx=iso(new Date(+base.slice(0,4),+base.slice(5,7)-1,+base.slice(8)+1));
 form(`<h3>Delay: ${esc(t.t)}</h3><p class="due">This goes in the delay log that everyone can see. It can\u2019t be removed.</p><label>Who is delaying it?<select name="by">${who}</select></label><label>Move it to (type it like 12/5)<input type="text" name="to" required autocomplete="off" value="${+nx.slice(5,7)}/${+nx.slice(8)}"></label><label>Reason (optional)<input type="text" name="why"></label>`,
 f=>{const to=mkDue(f.get("to"));if(!to){$("sync").textContent="Couldn\u2019t read that date. Try typing it like 12/5.";return}
  if(t.due&&to<=t.due){$("sync").textContent="A delay has to move the date later.";return}
  const by=S.people.find(p=>p.id===f.get("by"));
  (S.delays=S.delays||[]).push({id:uid(),tid:t.id,title:t.t,by:by?by.name:"Someone",from:t.due||"",to,why:(f.get("why")||"").trim(),at:iso(new Date())});
  t.due=to;save()})}
function renderDelays(){const all=S.delays||[],L=all.map((x,i)=>({...x,n:all.slice(0,i+1).filter(y=>y.tid===x.tid).length,tot:all.filter(y=>y.tid===x.tid).length})).reverse(),names=[...new Set(L.map(x=>x.by))];
 $("dl").innerHTML=`<h2>Delay log</h2><div class="cnt">Everyone can see this, and delays can\u2019t be removed.${names.length?" Total delays: "+names.map(n=>esc(n)+" "+L.filter(x=>x.by===n).length).join(" \u00b7 "):""}</div>`+(L.length?L.map(x=>`<div class="t"><div class="b"><div class="n"><b>${esc(x.by)}</b> delayed <b>${esc(x.title)}</b></div><div class="due">${x.from?"From "+fmt(x.from)+" ":""}to ${fmt(x.to)} \u00b7 delay ${x.n} of ${x.tot} on this task \u00b7 logged ${fmt(x.at)}</div>${x.why?`<div class="due" style="color:var(--ink)">Reason: ${esc(x.why)}</div>`:""}</div></div>`).join(""):'<div class="empty">Nothing has been delayed.</div>')}
$("add").onclick=()=>taskDlg();
$("names").onclick=()=>{form(`<h3>Names</h3>`+S.people.map(p=>`<div class="nm"><input type="text" name="n_${p.id}" value="${esc(p.name)}" aria-label="Name"><button type="button" data-rm="${p.id}">Remove</button></div>`).join("")+`<button type="button" data-np>+ Add person</button>`,
 f=>{S.people.forEach(p=>{const v=(f.get("n_"+p.id)||"").trim();if(v)p.name=v});save()})};
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.e)taskDlg(S.tasks.find(t=>t.id===b.dataset.e));
 else if(b.dataset.dl){delayDlg(S.tasks.find(t=>t.id===b.dataset.dl))}else if(b.dataset.del){if(cnt(b.dataset.del)){dlg.close();$("sync").textContent="A delayed task can\u2019t be deleted. Mark it done instead.";return}S.tasks=S.tasks.filter(t=>t.id!==b.dataset.del);dlg.close();save()}
 else if(b.dataset.rm){if(S.people.length>1){S.people=S.people.filter(p=>p.id!==b.dataset.rm);dlg.close();save()}}
 else if("np" in b.dataset){S.people.push({id:"p"+uid(),name:"New person"});dlg.close();save();$("names").click()}});
document.addEventListener("change",e=>{const id=e.target.dataset.c;if(!id)return;const t=S.tasks.find(x=>x.id===id);t.done=e.target.checked;save()});
const arr=x=>Array.isArray(x)?x.filter(Boolean):Object.values(x||{});
function load(){fetch(DB_URL.replace(/\/$/,"")+"/house.json").then(r=>r.json()).then(d=>{if(d&&d.people){S={...d,people:arr(d.people),tasks:arr(d.tasks).map(t=>t.os?{...t,os:arr(t.os)}:t),delays:arr(d.delays)};$("sync").textContent="v3 \u00b7 Connected. Last update received at "+new Date().toLocaleTimeString()}else if(!d){$("sync").textContent="v3 \u00b7 Connected. Nothing saved yet."}if(!dlg.open)render()}).catch(()=>{$("sync").textContent="Couldn\u2019t reach the shared list."})}
render();
if(!OK)$("sync").textContent="Not connected yet. The database address hasn\u2019t been added to this page.";
else{load();try{const es=new EventSource(DB_URL.replace(/\/$/,"")+"/house.json");es.addEventListener("put",load);es.addEventListener("patch",load)}catch(e){setInterval(load,10000)}}
</script></body></html>
